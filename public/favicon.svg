<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Background Rounded Studio Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#111315" stroke="#BCEE45" stroke-width="3"/>

  <!-- Subtle Glow / Studio Ring -->
  <circle cx="32" cy="34" r="22" fill="#BCEE45" fill-opacity="0.1"/>

  <!-- Headphone Headband Arc (Behind Ears) -->
  <path d="M13 33C13 19.5 21.2 11 32 11C42.8 11 51 19.5 51 33" stroke="#BCEE45" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M16 31C16 20.8 22.8 14 32 14C41.2 14 48 20.8 48 31" stroke="#3F6212" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Capybara Ears -->
  <circle cx="20" cy="20" r="5" fill="#8C6239" stroke="#111315" stroke-width="2.5"/>
  <circle cx="44" cy="20" r="5" fill="#8C6239" stroke="#111315" stroke-width="2.5"/>

  <!-- Capybara Head -->
  <rect x="15" y="19" width="34" height="31" rx="15" fill="#DFB17B" stroke="#111315" stroke-width="2.6"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="21.5" cy="35.5" rx="3.2" ry="2" fill="#F4978E" fill-opacity="0.75"/>
  <ellipse cx="42.5" cy="35.5" rx="3.2" ry="2" fill="#F4978E" fill-opacity="0.75"/>

  <!-- Happy Closed Studio Eyes -->
  <path d="M21 30.5C22.2 28.8 24.5 28.8 25.7 30.5" stroke="#111315" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38.3 30.5C39.5 28.8 41.8 28.8 43 30.5" stroke="#111315" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Capybara Snout / Muzzle -->
  <rect x="25.5" y="29" width="13" height="15" rx="6.5" fill="#9C7048"/>
  <!-- Nostrils -->
  <circle cx="29.8" cy="33.2" r="1.3" fill="#111315"/>
  <circle cx="34.2" cy="33.2" r="1.3" fill="#111315"/>
  <!-- Nose stem & smile -->
  <path d="M32 34.5V39.2M32 39.2C30.5 40.8 28.5 40.6 28 39.5M32 39.2C33.5 40.8 35.5 40.6 36 39.5" stroke="#111315" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left & Right Studio Headphone Cups (Lime Green #BCEE45) -->
  <rect x="7.5" y="27" width="9" height="15" rx="4.5" fill="#BCEE45" stroke="#111315" stroke-width="2.5"/>
  <line x1="12" y1="30.5" x2="12" y2="38.5" stroke="#3F6212" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="47.5" y="27" width="9" height="15" rx="4.5" fill="#BCEE45" stroke="#111315" stroke-width="2.5"/>
  <line x1="52" y1="30.5" x2="52" y2="38.5" stroke="#3F6212" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Mini Audio Waveform Badge at Bottom -->
  <rect x="20" y="51" width="24" height="6" rx="3" fill="#111315"/>
  <line x1="24" y1="54" x2="24" y2="54" stroke="#BCEE45" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="28" y1="52.5" x2="28" y2="55.5" stroke="#BCEE45" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="51.5" x2="32" y2="56.5" stroke="#BCEE45" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="36" y1="52.5" x2="36" y2="55.5" stroke="#BCEE45" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="40" y1="54" x2="40" y2="54" stroke="#BCEE45" stroke-width="2.4" stroke-linecap="round"/>
</svg>
