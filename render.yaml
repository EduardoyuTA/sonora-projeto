services:
  - type: web
    name: sonora-ffmpeg-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "4"
      - key: UPLOAD_TIMEOUT_MS
        value: "300000"
      - key: FFMPEG_TIMEOUT_MS
        value: "180000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MAX_REQUESTS_PER_WINDOW
        value: "12"
